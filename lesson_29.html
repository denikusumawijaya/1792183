{

    </div>`,
  examples:[
    {q:["Convert 3.5 km to metres.","Ubah 3,5 km ke meter."],
     steps:[["Kilometres to metres is large to small, so multiply by 1000.","Kilometer ke meter adalah dari besar ke kecil, jadi kalikan dengan 1000."],

     ans:["3.5 km = 3500 m","3,5 km = 3500 m"]},

/* ===================== 2. MILES & KM ===================== */
{
  unit:6, color:"#0d9488",
  title:["Convert between miles and kilometres","Mengonversi antara mil dan kilometer"],
  materi:`

    ${T("Kilometres are the <b>metric</b> unit used in most countries, including Indonesia.",

    <div class="key">
      ${T("<b>Key fact:</b> 5 miles ≈ 8 km",
          "<b>Fakta penting:</b> 5 mil ≈ 8 km")}
      ${T("So 1 mile ≈ 1.6 km and 1 km ≈ 0.625 miles (that is, 5/8 of a mile).",
          "Jadi 1 mil ≈ 1,6 km dan 1 km ≈ 0,625 mil (yaitu 5/8 mil).")}

      <tr><td>or × 1.6 <br><span class="id">atau kali 1,6</span></td><td>or ÷ 1.6 (× 0.625) <br><span class="id">atau bagi 1,6 (kali 0,625)</span></td></tr></table>
    ${T("A mile is longer than a kilometre, so the number of kilometres is always bigger than the number of miles.",

        "Kamu juga bisa menggunakan tabel rasio: 5 mil : 8 km, 10 mil : 16 km, 50 mil : 80 km.")}`,
  examples:[
    {q:["Convert 25 miles to kilometres.","Ubah 25 mil ke kilometer."],
     steps:[["Use 5 miles ≈ 8 km. Find how many groups of 5 miles: 25 ÷ 5 = 5.","Gunakan 5 mil ≈ 8 km. Cari berapa kelompok 5 mil: 25 ÷ 5 = 5."],
            ["Each group is 8 km: 5 × 8 = 40.","Setiap kelompok adalah 8 km: 5 × 8 = 40."]],

     ans:["56 km ≈ 35 miles","56 km ≈ 35 mil"]},

            ["Compare: 112 km > 110 km.","Bandingkan: 112 km > 110 km."]],
     ans:["70 miles is further.","70 mil lebih jauh."]}
  ],
  practice:[

    {q:["Convert 35 miles to kilometres.","Ubah 35 mil ke kilometer."],a:56,u:"km",sol:[["35 ÷ 5 = 7, 7 × 8 = 56 km","35 ÷ 5 = 7, 7 × 8 = 56 km"]]},
    {q:["Convert 40 km to miles.","Ubah 40 km ke mil."],a:25,u:"miles",sol:[["40 ÷ 8 = 5, 5 × 5 = 25 miles","40 ÷ 8 = 5, 5 × 5 = 25 mil"]]},
    {q:["Convert 72 km to miles.","Ubah 72 km ke mil."],a:45,u:"miles",sol:[["72 ÷ 8 = 9, 9 × 5 = 45 miles","72 ÷ 8 = 9, 9 × 5 = 45 mil"]]},
    {q:["Convert 3 miles to kilometres.","Ubah 3 mil ke kilometer."],a:4.8,u:"km",sol:[["1 mile ≈ 1.6 km, so 3 × 1.6 = 4.8 km","1 mil ≈ 1,6 km, jadi 3 × 1,6 = 4,8 km"]]},

    {q:["A road sign says London is 150 miles away. How far is this in kilometres?","Sebuah rambu jalan menunjukkan London berjarak 150 mil. Berapa jaraknya dalam kilometer?"],a:240,u:"km",sol:[["150 ÷ 5 = 30, 30 × 8 = 240 km","150 ÷ 5 = 30, 30 × 8 = 240 km"]]},
    {q:["Convert 20 km to miles.","Ubah 20 km ke mil."],a:12.5,u:"miles",sol:[["20 ÷ 8 = 2.5, 2.5 × 5 = 12.5 miles","20 ÷ 8 = 2,5, 2,5 × 5 = 12,5 mil"]]},
    {q:["Which is further: 45 miles or 75 km?","Mana yang lebih jauh: 45 mil atau 75 km?"],opts:["45 miles","75 km","They are equal"],optsId:["45 mil","75 km","Sama jauh"],a:1,
     sol:[["45 ÷ 5 = 9, 9 × 8 = 72 km. Since 75 km > 72 km, 75 km is further.","45 ÷ 5 = 9, 9 × 8 = 72 km. Karena 75 km > 72 km, maka 75 km lebih jauh."]]},
    {q:["The speed limit on a road is 60 miles per hour. What is this in km per hour?","Batas kecepatan di suatu jalan adalah 60 mil per jam. Berapa nilainya dalam km per jam?"],a:96,u:"km/h",sol:[["60 ÷ 5 = 12, 12 × 8 = 96 km/h","60 ÷ 5 = 12, 12 × 8 = 96 km/jam"]]}
  ]

/* ===================== 3. PROBLEM SOLVING ===================== */
{
  unit:6, color:"#c2410c",
  title:["Solve problems involving calculations and conversions of units of measure","Menyelesaikan soal yang melibatkan perhitungan dan konversi satuan ukuran"],
  materi:`
    ${T("In real-life problems, the measurements are often given in <b>different units</b>.",

  examples:[
    {q:["A bottle holds 1.5 litres of juice. How many 250 ml glasses can be filled from the bottle?","Sebuah botol berisi 1,5 liter jus. Berapa gelas berukuran 250 ml yang dapat diisi dari botol tersebut?"],

    {q:["A journey is 150 miles. A car uses 1 litre of petrol for every 12 km. How many litres of petrol does the car use? (5 miles ≈ 8 km)","Sebuah perjalanan berjarak 150 mil. Sebuah mobil menggunakan 1 liter bensin untuk setiap 12 km. Berapa liter bensin yang digunakan mobil itu? (5 mil ≈ 8 km)"],

/* ---------- RENDER ---------- */
const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");
const state = sections.map(s => s.practice.map(() => null)); // true/false/null
let current = 0;

function renderTabs(){
  tabsEl.innerHTML = sections.map((s,i)=>`
    <button class="tab ${i===current?'active':''}" style="--accent:${s.color}" onclick="go(${i})">
      <span class="id" style="font-style:normal;font-weight:700;color:${s.color}">UNIT ${s.unit}</span>
      <b><span class="num">${i+1}</span>${s.title[0]}</b>
      <span class="id">${s.title[1]}</span>
    </button>`).join("");
}

function renderSection(i){
  const s = sections[i];
  const ex = s.examples.map((e,k)=>`
    <div class="ex"><span class="tag">Example ${k+1} · Contoh ${k+1}</span>
      ${T(e.q[0],e.q[1])}
      <div class="step">${e.steps.map(st=>T(st[0],st[1])).join("")}</div>
      ${T(`<span class="ans">Answer: ${e.ans[0]}</span>`,`Jawaban: ${e.ans[1]}`)}
    </div>`).join("");

  const pr = s.practice.map((p,k)=>{
    let input;
    if(p.opts){
      input = `<div class="row">${p.opts.map((o,j)=>`<button class="opt" id="o${i}_${k}_${j}" onclick="pick(${i},${k},${j})">${o}<br><span class="id">${p.optsId[j]}</span></button>`).join("")}</div>`;
    } else {
      input = `<div class="row"><input type="text" id="in${i}_${k}" placeholder="${p.r?'e.g. / misal 2:3':'answer / jawaban'}" onkeydown="if(event.key==='Enter')check(${i},${k})"> <b>${p.u||''}</b>
        <button class="btn" onclick="check(${i},${k})">Check · Cek</button></div>`;
    }
    return `<div class="q"><span class="n">${k+1}.</span>${T(p.q[0],p.q[1])}
      ${input}
      <div class="row"><span class="fb" id="fb${i}_${k}"></span>
      <button class="btn ghost" onclick="toggleSol(${i},${k})">Show solution · Lihat pembahasan</button></div>
      <div class="sol" id="sol${i}_${k}">${p.sol.map(x=>T(x[0],x[1])).join("")}</div></div>`;
  }).join("");

  contentEl.innerHTML = `
  <div class="section" style="--accent:${s.color}">
    <div class="card"><span class="id" style="font-style:normal;font-weight:700">UNIT ${s.unit}</span><h2>${i+1}. ${s.title[0]}</h2><span class="id">${s.title[1]}</span></div>
    <div class="card"><h3>📘 Lesson · Materi</h3>${s.materi}</div>
    <div class="card"><h3>✏️ Worked Examples · Pembahasan 3 Soal</h3>${ex}</div>
    <div class="card"><h3>🧠 Practice · Latihan 10 Soal</h3>
      ${T("Type your answer as a number (use a decimal point, e.g. 4.5), then press Check.","Ketik jawabanmu dalam bentuk angka (gunakan titik desimal, misalnya 4.5), lalu tekan Cek.")}
      ${s.unit===7?T("For a ratio answer, type it in its simplest form with a colon, e.g. 2:3.","Untuk jawaban berupa rasio, ketik dalam bentuk paling sederhana dengan titik dua, misalnya 2:3."):""}
      ${pr}</div>
    <div class="score" style="--accent:${s.color}"><div id="sc"></div>
      <button class="btn" onclick="resetSec(${i})">Reset</button></div>
  </div>`;
  updateScore();
}

function parseNum(v){
  v = v.trim().replace(/\s/g,"").replace(/rp/i,"");
  // Indonesian thousands separator, e.g. 40.000 or 12.000
  if(/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g,"");
  // allow comma as decimal if single comma and no dot
  if(/^\d+,\d+$/.test(v) && !/^\d{1,3},\d{3}$/.test(v)) v = v.replace(",",".");
  v = v.replace(/,/g,"");
  return parseFloat(v);
}
function check(i,k){
  const p = sections[i].practice[k];
  const raw = document.getElementById(`in${i}_${k}`).value;
  if(p.r){
    const parts = raw.split(":").map(x=>parseNum(x));
    mark(i,k, parts.length===p.r.length && parts.every((x,j)=>x===p.r[j]));
    return;
  }
  const v = parseNum(raw);
  const ok = !isNaN(v) && Math.abs(v - p.a) < 1e-6 * Math.max(1,Math.abs(p.a)) + 0.001;
  mark(i,k,ok);
}
function pick(i,k,j){
  const p = sections[i].practice[k];
  p.opts.forEach((_,x)=>document.getElementById(`o${i}_${k}_${x}`).classList.toggle("sel",x===j));
  mark(i,k,j===p.a);
}
function mark(i,k,ok){
  state[i][k] = ok;
  const fb = document.getElementById(`fb${i}_${k}`);
  fb.className = "fb " + (ok?"ok":"bad");
  fb.innerHTML = ok ? "✔ Correct! · Benar!" : "✘ Try again · Coba lagi";
  updateScore();
}
function toggleSol(i,k){ document.getElementById(`sol${i}_${k}`).classList.toggle("show"); }
function updateScore(){
  const c = state[current].filter(x=>x===true).length;
  const el = document.getElementById("sc");
  if(el) el.innerHTML = `Score: <b>${c} / 10</b> <span class="id" style="display:inline">· Skor: ${c} / 10</span>`;
}
function resetSec(i){ state[i] = state[i].map(()=>null); renderSection(i); }
function go(i){ current=i; renderTabs(); renderSection(i); window.scrollTo({top:0,behavior:"smooth"}); }

go(0);
</script>
