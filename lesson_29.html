{

    {q:["Budi runs 5 laps of a 400 m track every day for 6 days. How many kilometres does he run in total?","Budi berlari 5 putaran di lintasan 400 m setiap hari selama 6 hari. Berapa kilometer total yang ia tempuh?"],a:12,u:"km",sol:[["5 × 400 × 6 = 12 000 m; 12 000 ÷ 1000 = 12 km","5 × 400 × 6 = 12.000 m; 12.000 ÷ 1000 = 12 km"]]},
    {q:["Tom is 5 feet tall. Use 1 foot ≈ 30 cm to find his height in cm.","Tinggi Tom adalah 5 kaki. Gunakan 1 kaki ≈ 30 cm untuk menentukan tingginya dalam cm."],a:150,u:"cm",sol:[["5 × 30 = 150 cm","5 × 30 = 150 cm"]]},
    {q:["A baby has a mass of 4 kg. Use 1 kg ≈ 2.2 pounds to find the baby's mass in pounds.","Massa seorang bayi adalah 4 kg. Gunakan 1 kg ≈ 2,2 pon untuk menentukan massa bayi dalam pon."],a:8.8,u:"pounds / pon",sol:[["4 × 2.2 = 8.8 pounds","4 × 2,2 = 8,8 pon"]]},
    {q:["Two towns are 90 miles apart. A bus travels at 48 km per hour. How many hours does the journey take? (5 miles ≈ 8 km)","Dua kota berjarak 90 mil. Sebuah bus melaju dengan kecepatan 48 km per jam. Berapa jam waktu perjalanannya? (5 mil ≈ 8 km)"],a:3,u:"hours / jam",sol:[["90 ÷ 5 = 18, 18 × 8 = 144 km; 144 ÷ 48 = 3 hours","90 ÷ 5 = 18, 18 × 8 = 144 km; 144 ÷ 48 = 3 jam"]]}
  ]
}
];

/* ---------- RENDER ---------- */
const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");
const state = sections.map(s => s.practice.map(() => null)); // true/false/null
let current = 0;

function renderTabs(){
  tabsEl.innerHTML = sections.map((s,i)=>`
    <button class="tab ${i===current?'active':''}" style="--accent:${s.color}" onclick="go(${i})">
      <b><span class="num">${i+1}</span>${s.title[0]}</b>
      <span class="id">${s.title[1]}</span>
    </button>`).join("");
}

function renderSection(i){
  const s = sections[i];
  const ex = s.examples.map((e,k)=>`
    <div class="ex"><span class="tag">Example ${k+1} · Contoh ${k+1}</span>
      ${T(e.q[0],e.q[1])}
      <div class="step">${e.steps.map(st=>T(st[0],st[1])).join("")}</div>
      ${T(`<span class="ans">Answer: ${e.ans[0]}</span>`,`Jawaban: ${e.ans[1]}`)}
    </div>`).join("");

  const pr = s.practice.map((p,k)=>{
    let input;
    if(p.opts){
      input = `<div class="row">${p.opts.map((o,j)=>`<button class="opt" id="o${i}_${k}_${j}" onclick="pick(${i},${k},${j})">${o}<br><span class="id">${p.optsId[j]}</span></button>`).join("")}</div>`;
    } else {
      input = `<div class="row"><input type="text" id="in${i}_${k}" placeholder="answer / jawaban" onkeydown="if(event.key==='Enter')check(${i},${k})"> <b>${p.u}</b>
        <button class="btn" onclick="check(${i},${k})">Check · Cek</button></div>`;
    }
    return `<div class="q"><span class="n">${k+1}.</span>${T(p.q[0],p.q[1])}
      ${input}
      <div class="row"><span class="fb" id="fb${i}_${k}"></span>
      <button class="btn ghost" onclick="toggleSol(${i},${k})">Show solution · Lihat pembahasan</button></div>
      <div class="sol" id="sol${i}_${k}">${p.sol.map(x=>T(x[0],x[1])).join("")}</div></div>`;
  }).join("");

  contentEl.innerHTML = `
  <div class="section" style="--accent:${s.color}">
    <div class="card"><h2>${i+1}. ${s.title[0]}</h2><span class="id">${s.title[1]}</span></div>
    <div class="card"><h3>📘 Lesson · Materi</h3>${s.materi}</div>
    <div class="card"><h3>✏️ Worked Examples · Pembahasan 3 Soal</h3>${ex}</div>
    <div class="card"><h3>🧠 Practice · Latihan 10 Soal</h3>
      ${T("Type your answer as a number (use a decimal point, e.g. 4.5), then press Check.","Ketik jawabanmu dalam bentuk angka (gunakan titik desimal, misalnya 4.5), lalu tekan Cek.")}
      ${pr}</div>
    <div class="score" style="--accent:${s.color}"><div id="sc"></div>
      <button class="btn" onclick="resetSec(${i})">Reset</button></div>
  </div>`;
  updateScore();
}

function parseNum(v){
  v = v.trim().replace(/\s/g,"").replace(/rp/i,"");
  // allow comma as decimal if single comma and no dot
  if(/^\d+,\d+$/.test(v) && !/^\d{1,3},\d{3}$/.test(v)) v = v.replace(",",".");
  v = v.replace(/,/g,"");
  return parseFloat(v);
}
function check(i,k){
  const p = sections[i].practice[k];
  const v = parseNum(document.getElementById(`in${i}_${k}`).value);
  const ok = !isNaN(v) && Math.abs(v - p.a) < 1e-6 * Math.max(1,Math.abs(p.a)) + 0.001;
  mark(i,k,ok);
}
function pick(i,k,j){
  const p = sections[i].practice[k];
  p.opts.forEach((_,x)=>document.getElementById(`o${i}_${k}_${x}`).classList.toggle("sel",x===j));
  mark(i,k,j===p.a);
}
function mark(i,k,ok){
  state[i][k] = ok;
  const fb = document.getElementById(`fb${i}_${k}`);
  fb.className = "fb " + (ok?"ok":"bad");
  fb.innerHTML = ok ? "✔ Correct! · Benar!" : "✘ Try again · Coba lagi";
  updateScore();
}
function toggleSol(i,k){ document.getElementById(`sol${i}_${k}`).classList.toggle("show"); }
function updateScore(){
  const c = state[current].filter(x=>x===true).length;
  const el = document.getElementById("sc");
  if(el) el.innerHTML = `Score: <b>${c} / 10</b> <span class="id" style="display:inline">· Skor: ${c} / 10</span>`;
}
function resetSec(i){ state[i] = state[i].map(()=>null); renderSection(i); }
function go(i){ current=i; renderTabs(); renderSection(i); window.scrollTo({top:0,behavior:"smooth"}); }

go(0);
</script>
</body>
